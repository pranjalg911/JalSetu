<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jal Setu — Village Water Intelligence &amp; Water Credits Platform</title>
<meta name="description" content="Jal Setu: predictive village water-stress forecasting, a Jal Sakhi companion, government schemes, and a Water Credits marketplace connecting companies to villages."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.0.0/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#16232A;
  --paper:#F1ECDE;
  --paper-2:#E8E0CB;
  --card:#FBF8EF;
  --teal:#1B6E71;
  --teal-deep:#0E4749;
  --red:#B23A2E;
  --red-bg:#F6E2DE;
  --yellow:#A9701B;
  --yellow-bg:#F6EAD2;
  --green:#2F6B45;
  --green-bg:#E1EEE0;
  --gold:#B8912B;
  --line: rgba(22,35,42,0.14);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --shadow: 0 1px 2px rgba(22,35,42,0.06), 0 8px 24px -12px rgba(22,35,42,0.18);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0 0 .4rem; letter-spacing:-0.01em;}
p{margin:0 0 .6rem;}
a{color:var(--teal-deep);}
.muted{color:#5B5646;}
.small{font-size:.85rem;}
.icon{display:inline-block; vertical-align:-3px;}

/* ---------- topographic ripple signature background ---------- */
.contour-bg{ position:relative; overflow:hidden; }
.contour-bg::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    repeating-radial-gradient(circle at 82% 18%, transparent 0 26px, rgba(27,110,113,.10) 27px 28px, transparent 29px 54px),
    repeating-radial-gradient(circle at 8% 88%, transparent 0 20px, rgba(184,145,43,.10) 21px 22px, transparent 23px 42px);
}

/* ---------- layout ---------- */
main{max-width:1180px; margin:0 auto; padding:0 1.5rem 4rem;}
.section{padding-top:2.5rem;}
.section-head{max-width:640px; margin-bottom:1.4rem;}
.section-head-row{display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.4rem;}
.eyebrow{ text-transform:uppercase; letter-spacing:.09em; font-size:.72rem; font-weight:700; color:var(--teal-deep); font-family:var(--font-mono);}

/* ---------- nav ---------- */
.nav{ position:sticky; top:0; z-index:20; background:rgba(241,236,222,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.nav-inner{max-width:1180px; margin:0 auto; padding:.85rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:.5rem; cursor:pointer; background:none; border:none;}
.brand-mark{color:var(--teal); display:flex;}
.brand-text{font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--ink); display:flex; flex-direction:column; line-height:1.05;}
.brand-sub{font-family:var(--font-body); font-weight:400; font-size:.62rem; color:#8a8368; letter-spacing:.04em;}
.nav-links{display:flex; gap:.15rem; flex-wrap:wrap;}
.nav-link{
  display:flex; align-items:center; gap:.4rem; padding:.45rem .7rem; border-radius:8px; border:none;
  background:none; color:#5B5646; font-family:var(--font-body); font-size:.83rem; font-weight:600; cursor:pointer;
}
.nav-link:hover{background:var(--paper-2); color:var(--ink);}
.nav-link.active{background:var(--teal); color:#fff;}

/* ---------- hero ---------- */
.hero{padding:3.6rem 1.5rem 2.6rem; border-bottom:1px solid var(--line);}
.hero-inner{max-width:1180px; margin:0 auto; position:relative;}
.hero h1{font-size:clamp(1.7rem, 3.2vw, 2.7rem); max-width:15ch; margin-bottom:.9rem;}
.hero-lede{max-width:58ch; font-size:1.02rem; color:#4A4536;}
.hero-stats{display:flex; gap:2.2rem; flex-wrap:wrap; margin-top:1.8rem;}
.hero-stats strong{display:block; font-family:var(--font-mono); font-size:1.5rem; color:var(--teal-deep);}
.hero-stats span{font-size:.78rem; color:#6b654e;}

/* ---------- role cards ---------- */
.role-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:1rem; margin-top:2.4rem;}
.role-card{
  text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.3rem;
  cursor:pointer; display:flex; flex-direction:column; gap:.35rem; box-shadow:var(--shadow); transition:transform .15s;
}
.role-card:hover{transform:translateY(-2px);}
.role-card-icon{width:38px; height:38px; border-radius:10px; background:var(--paper-2); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; margin-bottom:.3rem;}
.role-card h3{font-size:1.05rem;}
.role-card p{color:#5B5646; font-size:.87rem; flex:1;}
.role-card-go{font-size:.8rem; font-weight:700; color:var(--teal-deep); display:flex; align-items:center; gap:.25rem;}

/* ---------- loop steps ---------- */
.loop-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem;}
.loop-step{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem;}
.loop-num{font-family:var(--font-mono); color:var(--gold); font-weight:700; font-size:.8rem;}
.loop-step h3{margin-top:.3rem; font-size:1.05rem;}
.loop-step p{font-size:.85rem; color:#5B5646;}

/* ---------- cards / grids ---------- */
.console-grid, .js-grid, .company-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:1rem; align-items:start;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.15rem 1.3rem; box-shadow:var(--shadow);}
.card-lg{grid-column:span 2;}
@media (max-width:760px){.card-lg{grid-column:span 1;}}
.card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; margin-bottom:.4rem;}
.card h3{font-size:1.02rem;}

/* ---------- chips / bands ---------- */
.chip{display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:700; padding:.22rem .55rem; border-radius:99px; white-space:nowrap;}
.chip .dot{width:7px; height:7px; border-radius:50%;}
.chip-red{background:var(--red-bg); color:var(--red);}
.chip-red .dot{background:var(--red);}
.chip-yellow{background:var(--yellow-bg); color:var(--yellow);}
.chip-yellow .dot{background:var(--yellow);}
.chip-green{background:var(--green-bg); color:var(--green);}
.chip-green .dot{background:var(--green);}

/* ---------- village strip ---------- */
.village-strip{display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.6rem; margin-bottom:1.2rem;}
.v-chip{display:flex; align-items:center; gap:.4rem; border:1px solid var(--line); background:var(--card); border-radius:99px; padding:.4rem .8rem; font-size:.78rem; font-weight:600; white-space:nowrap; cursor:pointer; flex-shrink:0;}
.v-chip-dot{width:8px; height:8px; border-radius:50%;}
.v-chip-red .v-chip-dot{background:var(--red);}
.v-chip-yellow .v-chip-dot{background:var(--yellow);}
.v-chip-green .v-chip-dot{background:var(--green);}
.v-chip.active{border-color:var(--teal); box-shadow:0 0 0 2px rgba(27,110,113,.18);}
.v-chip-score{font-family:var(--font-mono); color:#8a8368;}

/* ---------- gauge ---------- */
.gauge-row{display:flex; gap:1.4rem; align-items:center; flex-wrap:wrap; margin:.8rem 0 1rem;}
.gauge-svg{width:180px; height:110px;}
.gauge-score{font-family:var(--font-mono); font-size:26px; font-weight:700;}
.gauge-label{font-size:9px; fill:#8a8368;}
.gauge-meta{display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem 1.4rem; flex:1; min-width:220px;}
.meta-label{display:block; font-size:.7rem; color:#8a8368; text-transform:uppercase; letter-spacing:.05em;}
.meta-val{font-family:var(--font-mono); font-weight:700; font-size:1rem;}

/* ---------- tables ---------- */
.mini-table{width:100%; border-collapse:collapse; font-size:.83rem; margin-top:.5rem;}
.mini-table th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:#8a8368; padding:.35rem .4rem; border-bottom:1px solid var(--line);}
.mini-table td{padding:.45rem .4rem; border-bottom:1px solid var(--line);}

/* ---------- advisory ---------- */
.advisory-list{list-style:none; padding:0; margin:.5rem 0 0; display:flex; flex-direction:column; gap:.6rem;}
.advisory-list li{display:flex; gap:.6rem; align-items:flex-start;}
.adv-icon{width:22px; height:22px; border-radius:50%; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
.advisory-list strong{font-size:.88rem;}
.advisory-list p{font-size:.82rem; color:#5B5646; margin:.1rem 0 0;}

/* ---------- stats ---------- */
.stat-row{display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px dashed var(--line); font-size:.87rem;}
.stat-row.total{border-bottom:none; border-top:1px solid var(--line); font-weight:700; padding-top:.55rem;}
.progress{background:var(--paper-2); border-radius:99px; height:8px; overflow:hidden; margin:.5rem 0;}
.progress-bar{background:var(--teal); height:100%;}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font-body); font-weight:700; font-size:.85rem; border-radius:9px; border:1px solid transparent;
  padding:.55rem .9rem; display:inline-flex; align-items:center; gap:.4rem; cursor:pointer; margin:.25rem .4rem .25rem 0; text-decoration:none;
}
.btn-primary{background:var(--teal); color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost:hover{background:var(--paper-2);}
.btn-done{background:var(--green-bg); color:var(--green); border-color:var(--green);}
.btn-xs{padding:.3rem .5rem; font-size:.72rem;}

/* ---------- inputs ---------- */
.select, .input{
  font-family:var(--font-body); font-size:.85rem; padding:.5rem .65rem; border-radius:8px; border:1px solid var(--line);
  background:#fff; color:var(--ink);
}
.input-sm{width:70px;}
.calc-row{display:flex; gap:.5rem; margin:.5rem 0;}
.calc-row .input{flex:1;}
.calc-result{background:var(--green-bg); color:var(--green); border-radius:8px; padding:.55rem .7rem; font-size:.85rem; font-weight:600;}

/* ---------- companion ---------- */
.companion-card{grid-column:span 2;}
@media (max-width:760px){.companion-card{grid-column:span 1;}}
.companion-log{background:var(--paper-2); border-radius:10px; padding:.8rem; min-height:70px; display:flex; flex-direction:column; gap:.5rem; margin:.6rem 0;}
.bubble{max-width:80%; padding:.5rem .75rem; border-radius:10px; font-size:.85rem;}
.bubble-bot{background:#fff; align-self:flex-start; border:1px solid var(--line);}
.bubble-user{background:var(--teal); color:#fff; align-self:flex-end;}
.companion-actions{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;}
.mic-btn{width:44px; height:44px; border-radius:50%; border:none; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.mic-btn.listening{background:var(--red); animation:pulse 1.1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(178,58,46,.5);}70%{box-shadow:0 0 0 12px rgba(178,58,46,0);}100%{box-shadow:0 0 0 0 rgba(178,58,46,0);}}
.chip-btn{display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line); background:#fff; border-radius:99px; padding:.4rem .75rem; font-size:.78rem; font-weight:600; cursor:pointer;}
.chip-btn:hover{background:var(--paper-2);}

/* ---------- schemes ---------- */
.scheme-filters{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem;}
.filter-pill{border:1px solid var(--line); background:var(--card); border-radius:99px; padding:.35rem .8rem; font-size:.78rem; font-weight:600; cursor:pointer;}
.filter-pill.active{background:var(--teal); color:#fff; border-color:var(--teal);}
.scheme-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1rem;}
.scheme-card{display:flex; flex-direction:column;}
.scheme-head{display:flex; gap:.4rem; margin-bottom:.4rem; flex-wrap:wrap;}
.scheme-level{background:var(--paper-2); font-size:.68rem; font-weight:700; padding:.15rem .5rem; border-radius:6px; color:#6b654e;}
.scheme-cat{background:var(--teal-deep); color:#fff; font-size:.68rem; font-weight:700; padding:.15rem .5rem; border-radius:6px;}
.scheme-benefit{font-size:.85rem; color:#4A4536; margin-top:.3rem;}
.scheme-card details{margin-top:.4rem; font-size:.83rem;}
.scheme-card summary{cursor:pointer; font-weight:700; color:var(--teal-deep); margin-bottom:.3rem;}
.tiny-list{margin:.2rem 0 .5rem; padding-left:1.1rem; font-size:.82rem; color:#5B5646;}
.scheme-actions{margin-top:auto; padding-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap;}

/* ---------- marketplace ---------- */
.marketplace-controls{display:flex; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap;}
.market-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem;}
.buy-row{display:flex; gap:.5rem; align-items:center; margin-top:.5rem;}
.tier-badge{font-size:.7rem; font-weight:700; padding:.2rem .55rem; border-radius:6px;}
.tier-bronze{background:#EADBC8; color:#7C5A2E;}
.tier-silver{background:#E4E4E4; color:#5A5A5A;}
.tier-gold{background:#F6E7B8; color:#8A6A0E;}
.tier-platinum{background:#DCEFEC; color:#0E4749;}

/* ---------- ledger ---------- */
.ledger-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:1.4rem;}
.stat-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; box-shadow:var(--shadow);}
.stat-card span{color:var(--teal); display:block; margin-bottom:.3rem;}
.stat-card strong{font-family:var(--font-mono); font-size:1.35rem; display:block;}
.stat-card p{font-size:.78rem; color:#6b654e; margin:.15rem 0 0;}
.alloc-legend{display:flex; flex-direction:column; gap:.4rem; font-size:.82rem; margin-top:.7rem;}
.alloc-legend .sw{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:.4rem;}

/* ---------- awards ---------- */
.award-hero{display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap; background:linear-gradient(120deg, var(--card), #FBF3DC);}
.award-hero-icon{color:var(--gold);}
.award-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-top:1rem;}
.award-mini{text-align:center;}
.award-mini-icon{color:var(--gold); display:block; margin-bottom:.3rem;}

/* ---------- modal ---------- */
#modal-root{display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:fixed; inset:0; background:rgba(22,35,42,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem;}
.modal{background:var(--card); border-radius:14px; padding:1.4rem; max-width:420px; width:100%; box-shadow:var(--shadow);}
.form-label{display:block; font-size:.78rem; font-weight:700; margin:.6rem 0 .3rem; color:#5B5646;}
.modal .input, .modal .select{width:100%;}
.modal-actions{display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem;}

/* ---------- toast ---------- */
#toast-root{position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); z-index:60;}
.toast{background:var(--ink); color:#fff; padding:.7rem 1.1rem; border-radius:99px; font-size:.85rem; display:flex; align-items:center; gap:.4rem; box-shadow:var(--shadow);}

/* ---------- footer ---------- */
.site-footer{max-width:1180px; margin:3rem auto 0; padding:1.4rem 1.5rem 2rem; border-top:1px solid var(--line); font-size:.78rem; color:#8a8368;}

/* ---------- misc ---------- */
details summary::-webkit-details-marker{display:none;}

/* ---------- login screen ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; position:relative; overflow:hidden;}
.login-card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:2.2rem; max-width:380px; width:100%; box-shadow:var(--shadow); position:relative; z-index:2;}
.login-brand{display:flex; align-items:center; gap:.6rem; margin-bottom:1.4rem;}
.login-brand span{color:var(--teal);}
.login-error{background:var(--red-bg); color:var(--red); border-radius:8px; padding:.5rem .7rem; font-size:.8rem; margin-top:.6rem;}
.login-demo{margin-top:1.2rem; padding-top:1rem; border-top:1px dashed var(--line); font-size:.76rem; color:#8a8368;}
.login-demo code{background:var(--paper-2); padding:.1rem .35rem; border-radius:5px;}

/* ---------- animated hero waves ---------- */
.hero-anim{position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:.55;}
.hero-anim svg{position:absolute; bottom:-10px; left:0; width:200%; height:120px;}
.hero-wave1{animation:drift 18s linear infinite;}
.hero-wave2{animation:drift 26s linear infinite reverse; opacity:.5;}
@keyframes drift{from{transform:translateX(0);} to{transform:translateX(-50%);}}
.hero-inner{position:relative; z-index:2;}

/* ---------- video resource cards ---------- */
.video-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem;}
.video-card iframe{width:100%; aspect-ratio:16/9; border-radius:10px; border:none; display:block;}
.video-card p{margin-top:.5rem;}

/* ---------- connection status ---------- */
.conn-badge{display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:700; padding:.2rem .6rem; border-radius:99px;}
.conn-ok{background:var(--green-bg); color:var(--green);}
.conn-bad{background:var(--red-bg); color:var(--red);}
.lang-select{font-size:.78rem; padding:.3rem .5rem; border-radius:7px; border:1px solid var(--line); background:#fff;}
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

const API_BASE = ""; // same origin — api_server.py serves this file too

/* ---- Auth ---------------------------------------------------------- */
const auth = {
  token: localStorage.getItem("jalsetu_token") || null,
  role: localStorage.getItem("jalsetu_role") || null,
  villageId: localStorage.getItem("jalsetu_village") || null,
  username: localStorage.getItem("jalsetu_username") || null,
};
function setAuth(data) {
  auth.token = data.token; auth.role = data.role; auth.villageId = data.village_id; auth.username = data.username;
  localStorage.setItem("jalsetu_token", data.token);
  localStorage.setItem("jalsetu_role", data.role);
  localStorage.setItem("jalsetu_village", data.village_id || "");
  localStorage.setItem("jalsetu_username", data.username);
}
function clearAuth() {
  auth.token = null; auth.role = null; auth.villageId = null; auth.username = null;
  localStorage.removeItem("jalsetu_token"); localStorage.removeItem("jalsetu_role");
  localStorage.removeItem("jalsetu_village"); localStorage.removeItem("jalsetu_username");
}
function isLoggedIn() { return !!auth.token; }

async function apiFetch(path, options = {}) {
  const headers = Object.assign({}, options.headers, auth.token ? { Authorization: "Bearer " + auth.token } : {});
  if (options.body) headers["Content-Type"] = "application/json";
  const res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  if (!res.ok) {
    let msg = "Request failed";
    try { msg = (await res.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ---- Deterministic "product layer" fields not modeled by the ML backend
   (population, Jal Sakhi contact, participation, etc.) — seeded by
   village_id so they stay stable across reloads, clearly separate from
   the real severity/geology/advisory fields which DO come from the API. */
const VILLAGE_NAME_POOL = [
  "Wadgaon Kolhati", "Kada Budruk", "Shirur Kasarwadi", "Ghansangvi", "Pathri Vasti",
  "Manwath Khurd", "Tuljapur Wadi", "Renapur", "Kandhar Bk", "Ambajogai Wadi",
  "Georai Khurd", "Sonpeth Vasti", "Partur Bk", "Bhokardan Wadi", "Kaij Kh",
];
const JAL_SAKHI_NAME_POOL = [
  "Sunita Jadhav", "Kavita Shinde", "Manisha Pawar", "Vaishali Kale", "Rekha More",
  "Anita Suryavanshi", "Pooja Deshmukh", "Savita Gaikwad", "Nirmala Bhosale", "Sangeeta Pawar",
];
function seededRand(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return () => { h = (h * 1103515245 + 12345) & 0x7fffffff; return h / 0x7fffffff; };
}
function pick(arr, r) { return arr[Math.floor(r() * arr.length)]; }

function deriveDemoFields(apiVillage) {
  const r = seededRand(apiVillage.village_id);
  const name = pick(VILLAGE_NAME_POOL, r);
  const jalSakhiName = pick(JAL_SAKHI_NAME_POOL, r);
  const population = Math.round(1800 + r() * 4000);
  const households = Math.round(population / 5.1);
  const severity = apiVillage.severity_score_predicted;
  return {
    name,
    district: apiVillage.taluka, // village_static_data.csv only carries taluka; district mirrors it here
    jalSakhi: { name: jalSakhiName, phone: "+91 90490 1" + String(Math.floor(r() * 9000) + 1000), since: String(2020 + Math.floor(r() * 4)) },
    population, households,
    quality: Math.round(55 + (100 - severity) * 0.3 + r() * 10),
    participation: Math.round(55 + (100 - severity) * 0.25 + r() * 15),
    availability: Math.round(20 + (100 - severity) * 0.6),
    trendImprovement: Math.round((r() - 0.5) * 20),
    creditPriceMult: severity >= 65 ? 1.3 + r() * 0.1 : severity >= 35 ? 1.0 : 0.85,
    fundingGoal: Math.round((150000 + severity * 5000) / 10000) * 10000,
  };
}

/* ---- Frontend-domain severity banding (red/yellow/green), computed from
   the REAL severity score returned by the API — independent of the
   Low/Moderate/High/Critical labels the backend's own advisory bands use,
   which are a different (also real) scale used in the advisory text. */
function severityBand(score) {
  if (score >= 65) return "red";
  if (score >= 35) return "yellow";
  return "green";
}
const BAND_META = {
  red:    { label: "Critical",  short: "Red",    color: "#B23A2E", bg: "#F6E2DE", ring: "#8E2C22" },
  yellow: { label: "Stressed",  short: "Yellow", color: "#A9701B", bg: "#F6EAD2", ring: "#8A5A15" },
  green:  { label: "Safe",      short: "Green",  color: "#2F6B45", bg: "#E1EEE0", ring: "#24532F" },
};
/* ---- Villages — now loaded from the REAL API, not hardcoded --------- */
let VILLAGES = []; // populated by loadVillages()

async function loadVillages() {
  const apiVillages = await apiFetch("/api/villages");
  VILLAGES = apiVillages.map(v => {
    const demo = deriveDemoFields(v);
    return {
      id: v.village_id,
      taluka: v.taluka,
      geology: v.geology_type,
      recharge: v.aquifer_recharge_potential,
      severity: v.severity_score_predicted,

      recommendedAction: v.recommended_action, // real advisory text from severity_engine.py

}

function village(id) { return VILLAGES.find(v => v.id === id); }

/* Advisory list for display — parses the REAL advisory string the
   backend generated (severity_engine.py::advise), split on its own
   " | " delimiter. No client-side re-invention of the rule engine. */
function adviseList(v) {
  return v.recommendedAction.split(" | ").map(text => {
    const title = text.split(":")[0].split(" — ")[0].split(",")[0].slice(0, 40);
    return { title: text, desc: "" };
  });
}

/* Twins — fetched fresh per village from the API (topographic matcher) */
async function fetchTwins(villageId) {
  const detail = await apiFetch(`/api/village/${villageId}`);
  return detail.twins;
}

function forecastTrend(finalScore) {
  // NOTE: the backend currently returns a single 6-week-ahead point
  // estimate, not a full weekly trajectory. This curve is an ILLUSTRATIVE
  // interpolation anchored on that real endpoint — it is not itself a
  // per-week model output. Flagged here and in the UI caption.
  const start = Math.max(finalScore - 26, 8);
  const weeks = 8;
  return Array.from({ length: weeks }, (_, i) => {
    const frac = i / (weeks - 1);
    const eased = 1 - Math.pow(1 - frac, 2);
    return { week: `Wk ${i + 1}`, severity: Math.round((start + (finalScore - start) * eased) * 10) / 10 };
  });
}

/* ---- Companies + Water Credits marketplace — PRODUCT-LAYER SIMULATION.
   This is NOT modeled by the ML backend (no sensor/model predicts CSR
   giving or credit pricing) — it's a demo of the funding mechanism the
   platform proposes. Seeded from the real village list so severity/band
   driving credit price IS real; the transactions themselves are simulated. */
const COMPANIES = [
  { id:"C001", name:"Deccan AgroChem Ltd.", industry:"Agrochemicals", monthlyLiters:4200000 },
  { id:"C002", name:"Marathwada Textile Mills", industry:"Textiles & Dyeing", monthlyLiters:6800000 },
  { id:"C003", name:"Beed Sugar Co-operative", industry:"Sugar Processing", monthlyLiters:9500000 },
];
COMPANIES.forEach(c => { c.totalSpent = 0; c.totalCredits = 0; c.impactPoints = 0; c.villagesSupported = new Set(); });

const LEDGER = [];
let txCounter = 1;
const CREDIT_BASE_PRICE = 200;
const CREDIT_LITERS = 1000;
const ALLOCATION = { infra: 0.60, stipend: 0.25, platform: 0.15 };
const IMPACT_MULT = { red: 3, yellow: 2, green: 1 };

function creditPrice(v) { return Math.round(CREDIT_BASE_PRICE * v.creditPriceMult); }
function recommendedCredits(monthlyLiters) { return Math.max(5, Math.round((monthlyLiters * 0.10) / CREDIT_LITERS)); }

function recordTransaction(companyId, villageId, credits) {
  const c = COMPANIES.find(x => x.id === companyId);
  const v = village(villageId);
  const price = creditPrice(v);
  const amount = price * credits;
  const allocation = {
    infra: Math.round(amount * ALLOCATION.infra),
    stipend: Math.round(amount * ALLOCATION.stipend),
    platform: Math.round(amount * ALLOCATION.platform),
  };
  const tx = { id: "TXN" + String(txCounter++).padStart(4, "0"), date: new Date().toISOString().slice(0, 10),
    companyId, villageId, credits, price, amount, allocation };
  LEDGER.unshift(tx);
  v.creditsSold += credits; v.fundsRaised += amount; v.litersOffset += credits * CREDIT_LITERS; v.stipendPool += allocation.stipend;
  c.totalSpent += amount; c.totalCredits += credits; c.impactPoints += credits * IMPACT_MULT[v.band]; c.villagesSupported.add(villageId);
  return tx;
}

function awardScore(v) {
  return Math.round((100 - v.severity) * 0.35 + v.participation * 0.25 + v.quality * 0.2 + v.availability * 0.1 + (v.trendImprovement + 10) * 1.0);
}
function rankedVillages() { return [...VILLAGES].sort((a, b) => awardScore(b) - awardScore(a)); }
function mostImproved() { return [...VILLAGES].sort((a, b) => b.trendImprovement - a.trendImprovement)[0]; }
function highestParticipation() { return [...VILLAGES].sort((a, b) => b.participation - a.participation)[0]; }
function bestQuality() { return [...VILLAGES].sort((a, b) => b.quality - a.quality)[0]; }

const BASE_STIPEND = 3000;
function stipendFor(v) {
  const performanceBonus = Math.round((v.participation / 100) * 1200);
  const fundBonus = Math.round(v.stipendPool * 0.15);
  return { base: BASE_STIPEND, performanceBonus, fundBonus, total: BASE_STIPEND + performanceBonus + fundBonus };
}

function severityGaugeSVG(score, band) {
  const r = 62, circumference = Math.PI * r;
  const pct = Math.min(100, Math.max(0, score)) / 100;
  const dash = circumference * pct;
  const color = BAND_META[band].color;
  return `<svg viewBox="0 0 148 90" class="gauge-svg">
    <path d="M12 74 A62 62 0 0 1 136 74" fill="none" stroke="#E4DDC8" stroke-width="12" stroke-linecap="round"/>
    <path d="M12 74 A62 62 0 0 1 136 74" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${circumference}"/>
    <text x="74" y="66" text-anchor="middle" class="gauge-score" fill="${color}">${score.toFixed(1)}</text>
    <text x="74" y="84" text-anchor="middle" class="gauge-label">/ 100 severity</text>
  </svg>`;
}

        <option value="funded" ${state.marketplaceSort === "funded" ? "selected" : ""}>Sort: closest to funded</option>
      </select>
      <select class="select" data-action="filterDistrict">${districts.map(d => `<option value="${d}" ${state.marketplaceDistrict === d ? "selected" : ""}>${d === "all" ? "All talukas" : d}</option>`).join("")}</select>
    </div>
    <div class="market-grid">${list.map(v => marketCard(v)).join("")}</div>
  </section>`;
}
function marketCard(v) {
  const price = creditPrice(v);
  const pctFunded = Math.min(100, Math.round((v.fundsRaised / v.fundingGoal) * 100));
  return `<div class="card market-card">
    <div class="card-head"><h3>${v.name}</h3>${bandChip(v.band)}</div>
    <p class="muted small">${v.taluka} &middot; ${v.geology} &middot; ${v.recharge} recharge</p>
    <div class="stat-row"><span>Severity (real)</span><strong>${v.severity.toFixed(1)} / 100</strong></div>
    <div class="stat-row"><span>Credit price</span><strong>${fmtINR(price)}</strong></div>
    <div class="progress"><div class="progress-bar" style="width:${pctFunded}%"></div></div>
    <p class="muted small">${fmtINR(v.fundsRaised)} of ${fmtINR(v.fundingGoal)} goal (${pctFunded}%)</p>
    <div class="buy-row"><input class="input input-sm" type="number" min="1" value="5" id="qty-${v.id}"/>
      <button class="btn btn-primary" data-action="buyCredits" data-id="${v.id}">${icon("coin", 15)} Buy credits</button></div>
  </div>`;
}

/* --------------------------------------------------------------------- */
/*  LEDGER + AWARDS                                                        */
/* --------------------------------------------------------------------- */
function renderLedger() {
  const totalRaised = LEDGER.reduce((s, t) => s + t.amount, 0);
  const totalCredits = LEDGER.reduce((s, t) => s + t.credits, 0);
  const totalStipend = LEDGER.reduce((s, t) => s + t.allocation.stipend, 0);
  return `
  <section class="section">
    <div class="section-head"><h2>Water Credits &amp; Transparency Ledger</h2><p>Every transaction, visible to all roles.</p></div>
    <div class="ledger-stats">
      <div class="stat-card"><span>${icon("coin", 18)}</span><strong>${fmtINR(totalRaised)}</strong><p>Total raised</p></div>
      <div class="stat-card"><span>${icon("droplet", 18)}</span><strong>${fmtNum(totalCredits)}</strong><p>Water Credits sold</p></div>
      <div class="stat-card"><span>${icon("users", 18)}</span><strong>${fmtINR(totalStipend)}</strong><p>Paid to Jal Sakhi stipends</p></div>
    </div>
    <div class="card card-lg"><h3>Transaction ledger</h3>
      <table class="mini-table"><thead><tr><th>ID</th><th>Date</th><th>Company</th><th>Village</th><th>Credits</th><th>Amount</th></tr></thead>
        <tbody>${LEDGER.map(t => `<tr><td>${t.id}</td><td>${t.date}</td><td>${COMPANIES.find(c=>c.id===t.companyId).name}</td><td>${village(t.villageId).name} ${bandChip(village(t.villageId).band)}</td><td>${t.credits}</td><td>${fmtINR(t.amount)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
  </section>`;
}
function renderAwards() {
  const ranked = rankedVillages();
  const winner = ranked[0];
  return `
  <section class="section">
    <div class="section-head"><h2>Village Awards</h2><p>Composite score blends real severity trend with participation/quality (product-layer metrics).</p></div>
    <div class="award-hero card">
      <span class="award-hero-icon">${icon("award", 34)}</span>
      <div><p class="eyebrow">Best Village — this cycle</p><h2>${winner.name}</h2><p class="muted">${winner.taluka} &middot; Score ${awardScore(winner)} &middot; ${bandChip(winner.band)}</p></div>
    </div>
    <div class="card card-lg" style="margin-top:1.5rem"><h3>Full leaderboard</h3>
      <table class="mini-table"><thead><tr><th>#</th><th>Village</th><th>Status</th><th>Score</th></tr></thead>
        <tbody>${ranked.map((v,i) => `<tr><td>${i+1}</td><td>${v.name}</td><td>${bandChip(v.band)}</td><td>${awardScore(v)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
  </section>`;
}
/* --------------------------------------------------------------------- */
/*  MASTER RENDER                                                          */
/* --------------------------------------------------------------------- */
function render() {
  const app = document.getElementById("app");

  if (!isLoggedIn()) {
    app.innerHTML = renderLogin();
    renderToast();
    return;
  }

  if (state.loading) {
    app.innerHTML = `<div class="login-wrap"><p>${icon("waves",22)} Loading live data from backend…</p></div>`;
    return;
  }
  if (state.loadError) {
    app.innerHTML = `<div class="login-wrap"><div class="login-card"><h3>Can't reach the backend</h3><p class="muted small">${state.loadError}</p><p class="muted small">Make sure <code>python src/api_server.py</code> is running, then reload this page.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div></div>`;
    return;
  }

  let body = "";
  if (state.role === "home") body = renderHome();
  else if (state.role === "console") body = renderConsole();
  else if (state.role === "jalsakhi") body = renderJalSakhi();
  else if (state.role === "company") body = renderCompany();
  else if (state.role === "ledger") body = renderLedger();
  else if (state.role === "awards") body = renderAwards();
  else if (state.role === "resources") body = renderResources();

  app.innerHTML = renderNav() + `<main>${body}</main>` + renderFooter();
  renderToast();
  drawCharts();
}
function renderFooter() {
  return `<footer class="site-footer">
    <p>Jal Setu — a water-stress early warning system for rural Maharashtra. Built by students of Cummins College of Engineering, Pune.</p>
    <p class="muted small">Scheme names, portals and figures are illustrative of real government programmes — always confirm current eligibility and amounts with the Gram Panchayat or the linked official portal before applying. Company/marketplace figures are a product-layer simulation; village severity, geology, and advisories come from the live ML backend.</p>
  </footer>`;
}
function renderToast() {
  const root = document.getElementById("toast-root");
  root.innerHTML = state.toast ? `<div class="toast">${icon("check", 15)} ${state.toast}</div>` : "";
}

/* --------------------------------------------------------------------- */
/*  CHARTS                                                                  */
/* --------------------------------------------------------------------- */
function destroyChart(key) { if (charts[key]) { charts[key].destroy(); delete charts[key]; } }
function drawCharts() {
  const feColor = "#16232A";
  if (document.getElementById("chart-forecast")) {
    const v = village(state.selectedVillageId);
    const data = forecastTrend(v.severity);
    destroyChart("forecast");
    charts.forecast = new Chart(document.getElementById("chart-forecast"), {
      type: "line",
      data: { labels: data.map(d => d.week), datasets: [{ label: "Forecast severity", data: data.map(d => d.severity),
        borderColor: BAND_META[v.band].color, backgroundColor: BAND_META[v.band].color + "33", fill: true, tension: 0.35, pointRadius: 3 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { color: feColor } }, x: { ticks: { color: feColor } } } },
    });
  }
  if (document.getElementById("chart-importance")) {
    destroyChart("importance");
    charts.importance = new Chart(document.getElementById("chart-importance"), {
      type: "bar",
      data: { labels: FEATURE_IMPORTANCE.map(f => f.name), datasets: [{ data: FEATURE_IMPORTANCE.map(f => f.value), backgroundColor: "#1B6E71" }] },
      options: { indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { ticks: { color: feColor } }, y: { ticks: { color: feColor } } } },
    });
  }
}

/* --------------------------------------------------------------------- */
/*  ACTIONS                                                                */
/* --------------------------------------------------------------------- */
const actions = {
  setRole(btn) { setRole(btn.dataset.role); },
  closeModal() { closeModal(); },

  async doLogin() {
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      const data = await apiFetch("/api/login", { method: "POST", body: JSON.stringify({ username, password }) });
      setAuth(data);
      await bootApp();
    } catch (e) {
      document.getElementById("login-error").innerHTML = `<div class="login-error">${e.message}</div>`;
    }
  },
  async doLogout() {
    try { await apiFetch("/api/logout", { method: "POST" }); } catch (e) {}
    clearAuth();
    render();
  },

  async selectVillage(btn) { await selectVillage(btn.dataset.id); },

  async switchJalSakhi(el) {
    state.activeJalSakhiVillageId = el.value;
    await refreshJalSakhiData(el.value);
    render();
  },
  switchCompany(el) { state.activeCompanyId = el.value; render(); },
  setVoiceLang(el) { state.voiceLang = el.value; },

  openLeakForm() {
    openModal(`
      <h3>Report a leak</h3>
      <label class="form-label">Location description</label>
      <input class="input" id="leak-location" style="width:100%" placeholder="e.g. near community tank, main pipe"/>
      <label class="form-label">Severity (self-assessed)</label>
      <select class="select" id="leak-severity" style="width:100%">
        <option>Minor drip</option><option>Steady leak</option><option>Burst pipe</option>
      </select>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" data-action="submitLeak">${icon("check", 15)} Submit report</button></div>`);
  },
  async submitLeak() {
    const location = document.getElementById("leak-location").value.trim() || "Unspecified location";
    const severity = document.getElementById("leak-severity").value;
    try {
      await apiFetch("/api/leak", { method: "POST", body: JSON.stringify({ village_id: state.activeJalSakhiVillageId, location, severity }) });
      await refreshJalSakhiData(state.activeJalSakhiVillageId);
      closeModal();
      showToast("Leak reported and saved to the server.");
      render();
    } catch (e) { showToast("Failed to save: " + e.message); }
  },

  openTankerForm() {
    const d = nextTuesday();
    const dateStr = d.toISOString().slice(0, 10);
    openModal(`
      <h3>Request a tanker</h3>
      <label class="form-label">Preferred date</label>
      <input class="input" type="date" id="tanker-date" style="width:100%" value="${dateStr}"/>
      <label class="form-label">Preferred time</label>
      <input class="input" type="time" id="tanker-time" style="width:100%" value="09:00"/>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" data-action="submitTanker">${icon("check", 15)} Submit request</button></div>`);
  },
  async submitTanker() {
    const date = document.getElementById("tanker-date").value;
    const time = document.getElementById("tanker-time").value;
    if (!date || !time) { showToast("Please choose both a date and a time."); return; }
    try {
      await apiFetch("/api/tanker", { method: "POST", body: JSON.stringify({ village_id: state.activeJalSakhiVillageId, date, time }) });
      await refreshJalSakhiData(state.activeJalSakhiVillageId);
      closeModal();
      showToast(`Tanker requested for ${date} at ${time}.`);
      render();
    } catch (e) { showToast("Failed to save: " + e.message); }
  },

  toggleMic() {
    state.listening = !state.listening;
    render();
    if (!state.listening) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast("Voice recognition isn't supported in this browser — try Chrome."); state.listening = false; render(); return; }
    const rec = new SR();
    rec.lang = state.voiceLang; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      state.companionLog.push({ from: "user", text });
      state.listening = false; render();
      respondCompanion(text);
    };
    rec.onerror = () => { state.listening = false; render(); };
    rec.onend = () => { if (state.listening) { state.listening = false; render(); } };
    rec.start();
  },
  companionQuery(btn) { respondCompanion(btn.dataset.q); },

  filterSchemes(btn) { state.schemeFilter = btn.dataset.cat; render(); },
  markApplied(btn) {
    const set = SCHEME_APPLICATIONS[btn.dataset.village] || (SCHEME_APPLICATIONS[btn.dataset.village] = new Set());
    if (set.has(btn.dataset.scheme)) set.delete(btn.dataset.scheme); else set.add(btn.dataset.scheme);
    render();
  },

  calcOffset() { state.companyLiters = document.getElementById("liters-input").value; render(); },
  sortMarketplace(el) { state.marketplaceSort = el.value; render(); },
  filterDistrict(el) { state.marketplaceDistrict = el.value; render(); },
  buyCredits(btn) {
    const id = btn.dataset.id;
    const qty = Math.max(1, parseInt(document.getElementById("qty-" + id).value, 10) || 1);
    const tx = recordTransaction(state.activeCompanyId, id, qty);
    showToast(`Purchased ${qty} Water Credits in ${village(id).name} for ${fmtINR(tx.amount)}.`);
    render();
  },

  downloadCertificate(btn) { showToast("PDF export omitted in this build — wire up jsPDF as in the original file if needed."); },
};

async function respondCompanion(message) {
  const v = village(state.activeJalSakhiVillageId);
  try {
    const data = await apiFetch("/api/chat", { method: "POST", body: JSON.stringify({ village_id: v.id, message }) });
    state.companionLog.push({ from: "bot", text: data.reply });
  } catch (e) {
    state.companionLog.push({ from: "bot", text: "Couldn't reach the backend for an answer just now." });
  }
  render();
}

/* --------------------------------------------------------------------- */
/*  EVENT DELEGATION                                                       */
/* --------------------------------------------------------------------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});

/* --------------------------------------------------------------------- */
/*  BOOT                                                                    */
/* --------------------------------------------------------------------- */
async function bootApp() {
  state.loading = true; state.loadError = null;
  render();
  try {
    await checkBackend();
    await loadVillages();
    await loadFeatureImportance();
    if (auth.villageId) state.activeJalSakhiVillageId = auth.villageId;
    if (state.activeJalSakhiVillageId) await refreshJalSakhiData(state.activeJalSakhiVillageId);
    state.loading = false;
  } catch (e) {
    state.loading = false;
    state.loadError = e.message;
  }
  render();
}

if (isLoggedIn()) { bootApp(); } else { render(); }
</script>
</body>
</html>
